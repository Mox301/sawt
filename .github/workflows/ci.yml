name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - name: requirements.txt files match the uv lock files
        run: make requirements && git diff --exit-code -- backend/requirements.txt frontend/requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install FFmpeg
        if: matrix.service == 'backend'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The model runtime (torch, transformers, pyannote) is not installed: tests use in-memory fakes.
      - run: uv sync --project ${{ matrix.service }} --locked
      - run: uv run --project ${{ matrix.service }} pytest ${{ matrix.service }}/tests -q
      - name: Example client tests
        if: matrix.service == 'backend'
        run: uv run --project backend pytest examples -q

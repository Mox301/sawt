[project]
name = "sawt-backend"
version = "1.0.0"
description = "Sawt API: bilingual Arabic/English conversation analysis with audio LLMs"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pydub>=0.25",
    "librosa>=0.11,<0.12",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Model runtime. Not needed for tests, which use in-memory fakes.
ml = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchcodec>=0.8,<0.9",
    "transformers>=4.54,<5",
    "mistral-common[audio]>=1.8.1",
    "accelerate>=1.0",
    "pyannote.audio>=4,<5",
    "sentencepiece",
    "protobuf",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning:pydub", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults

[tool.ruff.lint.per-file-ignores]
"prompts/*" = ["E501"]  # prompt text is kept verbatim

[tool.ruff.lint.isort]
known-first-party = ["backend"]

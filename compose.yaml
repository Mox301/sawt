# NVIDIA GPU (Linux + nvidia-container-toolkit):
#   docker compose run --rm -e HF_HUB_OFFLINE=0 api python -m backend.infrastructure.ml.download
#   docker compose up --build
# CPU only (linux/amd64 or linux/arm64, slow):  add  -f compose.yaml -f compose.cpu.yaml
# Ports are published on 127.0.0.1 only: the API has no authentication.
name: sawt

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sawt-api
    env_file:
      - path: .env
        required: false
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - models:/models
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: sawt-ui
    environment:
      SAWT_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api

volumes:
  models:

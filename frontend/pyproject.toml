[project]
name = "sawt-frontend"
version = "1.0.0"
description = "Sawt web UI: bilingual Arabic/English conversation analysis"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "streamlit>=1.40",
    "requests>=2.32",
    "plotly>=5.24",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["frontend"]
